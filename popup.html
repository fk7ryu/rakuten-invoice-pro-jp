<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 310px;
      margin: 0;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      color: #1e293b;
      background: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #161E2E;
      color: #fff;
      border-bottom: 3px solid #BF0000;
    }
    .header img { width: 32px; height: 32px; border-radius: 7px; }
    .header-title { font-size: 13.5px; font-weight: bold; line-height: 1.3; }
    .header-sub { font-size: 10.5px; color: #cbd5e1; }
    .body { padding: 14px 16px; }
    .plan-box {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
      border: 1px solid #fde68a;
      background: #fffbeb;
      color: #92400e;
    }
    .plan-box.pro {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }
    p {
      font-size: 11.5px;
      line-height: 1.55;
      color: #475569;
      margin: 0 0 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px 10px;
      background: linear-gradient(180deg, #d60000 0%, #BF0000 100%);
      color: #fff;
      font-weight: bold;
      font-size: 12.5px;
      border: 1px solid #990000;
      border-radius: 7px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
    }
    .btn:hover { filter: brightness(0.95); }
    .btn-dark {
      background: #161E2E;
      color: #fff;
      border-color: #161E2E;
    }
    .btn-sub {
      background: #fff;
      color: #334155;
      border: 1px solid #cbd5e1;
      font-weight: normal;
      font-size: 11.5px;
      padding: 7px;
    }
    .btn-sub:hover { background: #f1f5f9; }
    .links {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
    }
    .links a { color: #BF0000; text-decoration: none; cursor: pointer; }
    .links a:hover { text-decoration: underline; }
    .sibling-link {
      margin-top: 10px;
      padding: 7px 10px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
    }
    .sibling-link a { color: #b45309; font-weight: bold; text-decoration: none; }
    .sibling-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon128.png" alt="icon" />
    <div>
      <div class="header-title">楽天領収書一括ダウンローダー</div>
      <div class="header-sub">PDF・ZIP一括保存 / 会計ソフトCSV対応</div>
    </div>
  </div>

  <div class="body">
    <div id="plan-status" class="plan-box">プラン確認中...</div>
    <p>楽天市場の購入履歴ページを開くと、画面左上に一括取得パネルが表示されます。</p>

    <button id="open-orders" class="btn">楽天の購入履歴を開く</button>
    <button id="upgrade-btn" class="btn btn-dark" style="display:none;">Proプランにアップグレード（無制限＋会計CSV）</button>
    <button id="restore-btn" class="btn btn-sub" style="display:none;">購入済みの方（ライセンス復元）</button>
    <button id="dev-toggle-btn" class="btn btn-sub" style="display:none;">[開発用] Pro / Free 切替</button>

    <div class="sibling-link">
      <a href="https://fk7ryu.github.io/amazon-invoice-pro-jp/" target="_blank" rel="noopener">姉妹ツール：Amazon版はこちら →</a>
    </div>

    <div class="links">
      <a id="open-guide">使い方ガイド</a>
      <a href="https://fk7ryu.github.io/rakuten-invoice-pro-jp/" target="_blank" rel="noopener">公式サイト</a>
      <a href="mailto:fk7ryu@gmail.com?subject=%E3%80%90%E6%A5%BD%E5%A4%A9%E9%A0%98%E5%8F%8E%E6%9B%B8%E3%83%84%E3%83%BC%E3%83%AB%E3%80%91%E4%B8%8D%E5%85%B7%E5%90%88%E3%83%BB%E3%81%94%E8%A6%81%E6%9C%9B">不具合・要望</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
