<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: "Segoe UI", "Hiragino Sans", sans-serif;
      color: #111;
      background: #fafafa;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #111;
      border-bottom: 2px solid #BF0000;
      padding-bottom: 6px;
    }
    .plan-box {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
      border: 1px solid #ffe082;
      background: #fff8e1;
      color: #8d6e00;
    }
    .plan-box.pro {
      border-color: #ceead6;
      background: #e6f4ea;
      color: #137333;
    }
    p {
      font-size: 12px;
      line-height: 1.5;
      color: #444;
      margin: 0 0 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      background: #BF0000;
      color: #fff;
      font-weight: bold;
      font-size: 12.5px;
      border: 1px solid #990000;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #a30000;
    }
    .btn-dark {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .btn-dark:hover {
      background: #333;
    }
    .btn-sub {
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
      font-weight: normal;
      font-size: 11.5px;
      padding: 7px;
    }
    .btn-sub:hover {
      background: #f3f3f3;
    }
    .note {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>楽天領収書一括ダウンローダー</h1>
  <div id="plan-status" class="plan-box">プラン確認中...</div>
  <p>楽天市場の購入履歴ページを開くと、画面左上にPDF一括取得パネルが表示されます。</p>

  <button id="open-orders" class="btn">楽天の購入履歴を開く</button>
  <button id="upgrade-btn" class="btn btn-dark" style="display:none;">Proプランにアップグレード（無制限＋CSV）</button>
  <button id="restore-btn" class="btn btn-sub" style="display:none;">購入済みの方（ライセンス復元）</button>
  <button id="dev-toggle-btn" class="btn btn-sub" style="display:none;">[開発用] Pro / Free 切替</button>

  <div class="note">※ 実行前に楽天会員へログインしてください。PDFはダウンロードフォルダ内の「楽天領収書」に保存されます。</div>
  <script src="popup.js"></script>
</body>
</html>
